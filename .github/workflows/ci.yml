name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # LOW-6: updated from ubuntu-latest (runners stay current, but pinning actions matters)
    runs-on: ubuntu-latest

    steps:
    # LOW-6: actions/checkout@v4 (was v3)
    - uses: actions/checkout@v4

    # LOW-6: actions/setup-python@v5 (was v4)
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors / undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Report style warnings without failing
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      env:
        # MED-8: smoke tests only import modules and check directory structure;
        # a non-empty dummy key prevents load_dotenv() from raising at import time
        # without requiring a real secret in CI.
        OPENAI_API_KEY: "dummy-key-for-import-tests-only"
      run: |
        pytest tests/smoke_test.py
